# v2 (ADR-017, pre-W12): same 14x11 m shell and wall features as static_world v2
# (ADR-015) so every static point keeps >=2.25 m clearance under the frozen W10
# 1.65/1.95 m zones and the W11 2.05 m navigation radius. The A->B corridor is
# clear; the blocking region coincides with static_world's validated island, so a
# parked blocker leaves the two proven 5 m passages as detours. Dynamic timing,
# speeds and seeds belong in a separate W12 events/test-suite file, not here:
# any byte change of this file invalidates its saved map (W09 provenance).
