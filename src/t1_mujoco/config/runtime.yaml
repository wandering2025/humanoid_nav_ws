# Runtime parameters. Simulation uses explicit data.time stamps.
t1_diagnostic:
  ros__parameters:
    task: t1_walk
    mode: sim_only
    use_sim_time: false
    upstream_path: ""  # launch argument or T1_UPSTREAM
    assets_path: ""    # optional; defaults to installed booster_assets

# W04 single physics owner; W05 command_map gates /cmd_vel.
t1_sim:
  ros__parameters:
    use_sim_time: false  # explicit data.time stamps; no /clock feedback
    task: t1_walk
    mode: sim_only
    upstream_path: ""
    headless: true
    target_rtf: 1.0
    enable_policy_cmd_input: false
    assets_path: ""
    scene: ""  # W07: layout name or absolute YAML/MJCF; empty = upstream. empty = frozen upstream original scene
    viewer_rate_hz: 30.0
    cmd_timeout_sim: 0.5
    cmd_timeout_wall: 0.5
    warmup_sim_s: 2.0  # W05: settles to standing noise by 2.0 s (docs/evidence/W05)
    run_id: ""
    seed: 0
    max_sim_time: 0.0  # zero = run until signal/viewer close
    command_map_file: ""  # "" = /cmd_vel UNCALIBRATED; launch passes config/command_map.yaml (W05)
    joint_state_divisor: 1  # W06: 50 Hz / divisor, integer policy-step schedule
