# Runtime parameters. Simulation uses explicit data.time stamps.
t1_diagnostic:
  ros__parameters:
    task: t1_walk
    mode: sim_only
    use_sim_time: false
    upstream_path: ""  # launch argument or T1_UPSTREAM
    assets_path: ""    # optional; defaults to installed booster_assets

# W04: single physics owner; /cmd_vel is uncalibrated until W05.
t1_sim:
  ros__parameters:
    use_sim_time: false  # explicit data.time stamps; no /clock feedback
    task: t1_walk
    mode: sim_only
    upstream_path: ""
    headless: true
    target_rtf: 1.0
    enable_policy_cmd_input: false
    assets_path: ""
    scene: ""  # empty = frozen upstream original scene
    viewer_rate_hz: 30.0
    cmd_timeout_sim: 0.5
    cmd_timeout_wall: 0.5
    warmup_sim_s: 2.0  # development startup; W05 must calibrate
    run_id: ""
    seed: 0
    max_sim_time: 0.0  # zero = run until signal/viewer close
    command_map_file: ""  # W05
