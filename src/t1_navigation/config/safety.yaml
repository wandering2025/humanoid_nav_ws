# W10; derivation and limitations: docs/architecture/safety.md
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 50.0
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity: [0.75, 0.0, 0.85]
    min_velocity: [0.0, 0.0, -0.85]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.75, 0.0, -1.5]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3
    odom_topic: /odom
    odom_duration: 0.1
collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    state_topic: /collision_monitor_state
    transform_tolerance: 0.05
    source_timeout: 0.3
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [Stop, Slow]
    Stop:
      type: circle
      radius: 1.65
      action_type: stop
      min_points: 1
      visualize: true
      polygon_pub_topic: /safety/stop_zone
      enabled: true
    Slow:
      type: circle
      radius: 1.95
      action_type: slowdown
      slowdown_ratio: 0.5
      min_points: 1
      visualize: true
      polygon_pub_topic: /safety/slow_zone
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true
      source_timeout: 0.3
t1_command_gate:
  ros__parameters:
    use_sim_time: true
    source_timeout: 0.3
    health_timeout: 0.3
