# W11 Nav2 (installed Jazzy 1.3.13). Derivation: docs/evidence/W11/README.md, ADR-015/016.
# Motion limits come from W05 command_map.yaml (vx [0.315,0.75], walking |wz|<=0.45,
# in-place |wz| [0.56,0.85], no reverse/lateral); safety zones from W10 safety.yaml.
# Controller/behavior outputs go to /t1/nav/cmd_vel_raw -> t1_navigation_adapter ->
# /t1/cmd_navigation -> W10 gate/smoother/collision_monitor. Nothing here publishes /cmd_vel.
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # W11R1: C09 measured a 0.27 s late ACK; bound RPCs separately from motion.
    # Actual endpoint probes and command epochs handle discovery and late goals.
    default_server_timeout: 500
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    transform_tolerance: 0.2
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # default_nav_to_pose_bt_xml is set by navigation.launch.py (installed share path).
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    odom_topic: /odom
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    # Gait start (t90 <=1.8 s), in-place turns (<=3.1 s settle) and safety waits
    # count; a stuck robot fails after 20 s without 0.3 m or 0.5 rad of progress.
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.3
      required_movement_angle: 0.5
      movement_time_allowance: 20.0
    # Success only when stationary inside tolerance: W05/W11 measured up to 17-26 deg
    # yaw rebound after stopping an in-place turn, so "entered the band while
    # turning" is not arrival. Frozen in W11 C2; see README "terminal criteria".
    general_goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      trans_stopped_velocity: 0.08
      rot_stopped_velocity: 0.08
    FollowPath:
      # W11R1: path tracking must request executable gait commands, rather than
      # predict continuous sub-gait motion that the W05 adapter cannot execute.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.40
      lookahead_dist: 0.60
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.33
      approach_velocity_scaling_dist: 0.60
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.33
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.60
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.60
      rotate_to_heading_angular_vel: 0.60
      # Controller internal acceleration only: first turn intent exceeds .05.
      # Physical acceleration remains limited by the unchanged W10 smoother.
      max_angular_accel: 2.0
      allow_reversing: false
      stateful: true
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_cancel_deceleration: false
      transform_tolerance: 0.2

# Navigation footprint = circle 2.05 m: W10 slowdown circle 1.95 m + 0.10 m
# (one 0.05 m cell + localization). It contains the 0.695 m body rotation radius
# and the 1.65 m stop circle, so nominal paths never trigger CM stop/slowdown.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.2
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 2.05
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        # /scan is W08's compensated planar projection of hits 0.15-1.20 m above
        # ground in laser_stabilized; its points sit at lidar height. These height
        # bounds only pass that plane; they do not imply 3D occupancy.
        scan:
          topic: /scan
          data_type: "LaserScan"
          sensor_frame: laser_stabilized
          expected_update_rate: 0.3
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.15
          obstacle_max_range: 6.0
          raytrace_min_range: 0.15
          raytrace_max_range: 6.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 2.60
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.2
      robot_radius: 2.05
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          sensor_frame: laser_stabilized
          expected_update_rate: 0.3
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.15
          obstacle_max_range: 6.0
          raytrace_min_range: 0.15
          raytrace_max_range: 6.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 2.60
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    # W11R1: include terminal heading in a forward-only path. The 1.0 m
    # turning radius fits vx<=0.45 / |wz|<=0.45 without in-place terminal turns.
    # The frozen 2.05 m radius and inscribed/lethal cost cells remain obstacles.
    GridBased:
      plugin: "t1_navigation::ExactGoalLattice"
      tolerance: 0.0
      allow_unknown: false
      # Installed Jazzy diff primitives: 0.05 m grid, 1.0 m walking radius,
      # forward curves plus in-place heading changes. Never expand in reverse.
      lattice_filepath: "/opt/ros/jazzy/share/nav2_smac_planner/sample_primitives/5cm_resolution/1m_turning_radius/diff/output.json"
      allow_reverse_expansion: false
      rotation_penalty: 5.0
      smooth_path: true
      max_planning_time: 2.0
      max_iterations: 1000000
      max_on_approach_iterations: 1000

# Only Wait is loaded. Spin/backup/drive_on_heading are disabled: W05 forbids
# reverse; an unconditional spin would ignore W10 slowdown and the in-place band.
behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: false
    bond_timeout: 4.0
    attempt_respawn_reconnection: false
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator"]

t1_navigation_adapter:
  ros__parameters:
    use_sim_time: true
    publish_rate_hz: 50.0
    input_timeout_s: 0.15
    # Pre-collision-monitor shaping (ADR-016). Below these a request is zeroed;
    # between them and the W05 minimum it is raised to the minimum.
    vx_lift_threshold: 0.01
    vx_lift_target: 0.33
    # Sub-gait requests curving tighter than the W05 walking minimum radius
    # vx_min/wz_walking_max = 0.70 m become in-place turns instead of lifted walking.
    min_walking_radius: 0.70
    # W11R1: active path correction intents 0.058..0.15 rad/s must not be
    # discarded as idle. Output stays in the frozen W05 0.56..0.85 band.
    wz_lift_threshold: 0.05
    wz_in_place_target: 0.60

t1_navigation_starter:
  ros__parameters:
    use_sim_time: true
    ready_timeout_wall_s: 120.0
