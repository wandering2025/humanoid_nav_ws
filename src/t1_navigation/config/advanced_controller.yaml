# Advanced-only deterministic path tracking for the calibrated forward-walking gait.
# NavFn, RotationShim, physical adapter, costmaps and safety remain unchanged.
# Baseline navigation.yaml retains MPPI; original goal tolerances remain 0.20/0.20.
controller_server:
  ros__parameters:
    FollowPath:
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.40
      lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.5
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.315
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 4.0
      # The unchanged outer RotationShim owns in-place rotations.
      use_rotate_to_heading: false
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_robot_pose_search_dist: 5.0
