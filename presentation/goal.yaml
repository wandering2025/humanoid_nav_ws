# Editable B-point interface. Read at EVERY advanced-demo launch.
# Coordinates: metres in the ROS map frame; +X east, +Y north.
# Allowed inclusive ranges: 11.0 <= x <= 12.0; -0.5 <= y <= 0.5.
# Final heading is fixed south (-90 degrees). Do not add a yaw field.
# Final handover is derived automatically as (x, y + 2.5).
# Keep these ranges: they preserve wide static clearance, cart interaction,
# the occluded A-to-B route and the existing straight walking approach.
# Edit between runs; changes during a run apply to the NEXT run.
# Validate with: ./scripts/run_advanced_demo.sh --check-goal
schema: 1
frame: map
goal:
  x: 12.0
  y: 0.0
