  position_m: 0.3
  yaw_deg: 20.0
  settle_s: 2.0
  time_limit_s: 120.0
arrival: Nav2 SUCCEEDED AND localization tool verified AND tool exit0 AND independent
  truth position<=0.30m/yaw<=20deg; 0.5sim-s speed window <0.05m/s and <0.05rad/s
  continuously 2s, completed within first accepted goal +120sim-s
success_counts:
  static: 10
  crossing: 9
  blocking: 9
  sudden: 9
blocking: at least one SUCCESS with real detour and blocker retained, as frozen dynamic_evidence
safety:
  contact_sampling_hz: 500
  event_gap_s: 0.04
  definition: trunk collision geometry vs static_env/obstacle; ground_nonfoot counted;
    foot-ground/self excluded
  required_totals:
    static_env: 0
    obstacle: 0
    ground_nonfoot: 0
    fall: 0
    fault: 0
  fall: frozen runner height<0.50m or projected gravity z>-.5; FAULT as frozen runner
rtf:
  workload: all 40 frozen full navigation headless episodes, target_rtf=1.0; no dedicated
    GUI or target1.1 substitution
  method: scripts/report_evaluation.py:performance, exact frozen function; pool every
    rtf_10s sample with wall_mono - first wall_mono >=10; each RTF is delta simulation
    / delta wall in rolling10wall-s window
  warmup: first10wall-s excluded only to obtain full windows; no other samples removed
  threshold: unrounded pooled median >=1.0
  statistics:
  - n
  - median
  - p5
  - p95
  - max
  raw: each run_data/<run_id>/sim_trace.csv wall_mono,sim_time,rtf_10s; all samples
    preserved
  headless: true
  physics_dt: 0.002
  decimation: 10
  policy_dt: 0.02
invalid: Only independently proven test infrastructure failure before any robot behavioral
  result; preserve all data and never relabel valid startup/navigation/safety failure.
  Controlled post-evaluation DDS nonzero is not INVALID. No replacement/retry without
  an existing frozen rule and evidence; unresolved infrastructure stops campaign.
abort: Immediately stop current run on observed environment/dynamic/nonfoot contact,
  fall, FAULT, uncontrolled motion or inability to stop; stop whole campaign on these
  or forced termination, residual process/port, source/fingerprint drift or unexplained
  missing evidence. Normal navigation timeout/planning/convergence failure stays in
  denominator and next case continues if shutdown/cleanup safe. Candidate abnormal
  exit yields FAIL; infrastructure fault preventing sufficient completion and not
  attributable to candidate yields INFRASTRUCTURE_ABORT.
execution: one first attempt per case in fixed order; fresh worker/DDS/full launch/strategy/clock/TF/AMCL/costmap;
  --limit1 and check evidence before next; no pilot or independent verification matrix
