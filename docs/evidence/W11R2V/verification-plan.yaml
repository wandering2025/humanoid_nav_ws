  - no manual control
  - no truth feedback
  - no base-pose edits
stage_acceptance:
  A: 10/10 full cold starts; 18/18 child exit0, starter exit0, exactly one normal
    SIGINT after readiness; no target/nonzero gait before ready; no traceback/escalation/residual
    processes/ports; zero contacts/falls
  B: 3/3 per original C01 C09 B04 B06; stop on first valid candidate failure
  C: W11 S01-S05 5/5 with original goals/seeds/criteria; at least one real detour;
    valid TF/scan/AMCL and single command chain
  D: Frozen cancellation thresholds; late old epoch cannot pollute; replacement_settle
    true plus original verdict PASS; clean exits
  E: 'Original W12 smoke threshold: >=1 full success per 3-run category, blocking
    real detour, approach physical stop/resume, crossing scan/costmap; static S03x1
    success; zero contacts/falls/all valid runs, no W13 9/10 substitution'
classification:
  FAIL: Any candidate startup/lifecycle/action/service/TF/process fault, timeout,
    missed goal, failed automated test, unsafe behavior, unexplained abnormal exit
    or unreclaimed process; ABORTED0 never success
  INVALID:
  - Proven tester command/output/foreign-process infrastructure error identified before
    viewing behavioral outcome; preserve raw; at most one retry, never candidate lifecycle/action/service/TF/exit
    error
  invalid_retry: At most one after proven verifier error, preserve both; never retry
    candidate failure
  stop_rule: Freeze/build/test/cold-start/candidate traceback, nonzero child exit,
    forced shutdown or residual process => immediate FAIL; target/W11/cancel failure=>FAIL;
    W12 retain first runs under original >=1/3 threshold; stop when required threshold
    impossible or safety/process defect.
fault_injection:
- missing lifecycle endpoint
- missing map->odom
- unconfirmed initialpose
- late action ACK
- nonresponsive costmap
- FollowPath ABORTED0
- terminal overshoot
- parking yaw rebound
- three corrections exhausted
- late old-goal command
- cancel command clearing
- manager shutdown
- illegal second command publisher
fault_method: Existing frozen automated tests in static stage; compare real ROS manager/planner/controller
  outputs and all new physical observations; no injection or test logic edits.
