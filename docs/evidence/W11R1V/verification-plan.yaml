- /usr/bin/colcon build --symlink-install --base-paths src
- /usr/bin/colcon test --base-paths src
- /usr/bin/colcon test-result --all --verbose
expected_tests:
  packages: 4
  tests: 151
  errors: 0
  failures: 0
  skipped: 0
navigation_acceptance:
  position_max_m: 0.3
  yaw_max_deg: 20.0
  velocity_window_s: 0.5
  linear_speed_strict_max: 0.05
  angular_speed_strict_max: 0.05
  continuous_stability_s: 2.0
  task_limit_sim_s: 120
  requires:
  - Nav2 SUCCEEDED
  - localized tool verification
  - independent truth verification
  - zero static/obstacle/nonfoot contacts
  - zero falls
  - valid safety chain
  - no manual control
  - no truth feedback
  - no base-pose edits
stage_acceptance:
  B: 10/10 startup, actual bounded ACK and costmap responses, normal exits, no stale
    graph or remnants
  C: 3/3 each; stop subsequent costly runs on first candidate failure
  D: 5/5; detour, TF, scan, localization and unique command chain
  E: cancel correct, clear old commands, policy zero, stop <=.453m, latched until
    arm, new goal reaches full stable arrival, no contacts/falls/remnants
  F: each class >=1/3 full success, blocking real detour with entity present, approach
    physical stop and resume, crossing scan/costmap detection, S03 succeeds, zero
    contacts/falls in all ten; preserve first failures; no W13 9/10 criterion
classification:
  FAIL: Any candidate startup/lifecycle/action/service/TF/process fault, timeout,
    missed goal, failed automated test, unsafe behavior, unexplained abnormal exit
    or unreclaimed process; ABORTED0 never success
  INVALID:
  - tester wrong command
  - wrong output directory
  - unrelated external port occupation
  - user interruption/power loss/reboot
  - source or frozen dependency mismatch
  - recorder failure before candidate executed with proof
  INCOMPLETE: External environment or evidence missing, need to change frozen test
    logic, or interruption/budget prevents complete verdict
  invalid_retry: At most one after proven verifier error, preserve both; never retry
    candidate failure
  stop_rule: 'Freeze failure: INVALID no physical tests. Candidate failure: preserve
    scene/logs and stop subsequent meaningless costly tests, FAIL. No repairs.'
fault_injection:
- missing lifecycle endpoint
- missing map->odom
- unconfirmed initialpose
- late action ACK
- nonresponsive costmap
- FollowPath ABORTED0
- terminal overshoot
- parking yaw rebound
- three corrections exhausted
- late old-goal command
- cancel command clearing
- manager shutdown
- illegal second command publisher
fault_method: Existing frozen automated tests in stage A; compare real ROS manager/planner/controller
  outputs, startup traces and later physical observations; no new injection/test logic.
  Any unproven external behavior stays unproven.
